name: 'SemVer Tag and Docker Build'
on:
  pull_request:
    types: [ closed ]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: 'Main Semver Tag'
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'skip-release') == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Calculate SemVer value
        id: calculate
        uses: UKHomeOffice/sas-github-workflows/.github/actions/calculate-semver-value@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_to_highest: ${{ github.base_ref == 'main' }}

      - name: Build project
        uses: UKHomeOffice/sas-github-workflows/.github/actions/gradle-build-project@v1
        with:
          java_version: '17'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to repository
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.DOCKER_USER_NAME || secrets.QUAY_ROBOT_USER_NAME }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.QUAY_ROBOT_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Calculate metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: quay.io/ukhomeofficedigital/hocs-workflow
          tags: |
            type=raw,value=${{ steps.calculate.outputs.version }}
            type=raw,value=latest,enable=${{ github.base_ref == 'main' }}

      - name: Push container
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=quay.io/ukhomeofficedigital/hocs-workflow:buildcache
          cache-to: type=registry,ref=quay.io/ukhomeofficedigital/hocs-workflow:buildcache,mode=max,ignore-error=true

      - name: Tag Repository
        uses: UKHomeOffice/semver-tag-action@v3
        with:
          tag: ${{ steps.calculate.outputs.version }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
